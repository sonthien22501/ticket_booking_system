# Upstream microservice definitions
upstream catalog_service {
    server catalog-service:8081;
}

upstream inventory_service {
    server inventory-service:8082;
}

upstream booking_service {
    server booking-service:8083;
}

upstream auth_service {
    server auth-service:8084;
}

# Map for rate limit key: allows whitelisted internal tests/services to bypass,
# while enforcing strict per-IP rate limiting on all public client traffic.
map $http_x_rate_limit_bypass $limit_ip {
    "true" "";
    "1" "";
    default $binary_remote_addr;
}

# Rate limit zones:
# 1. Booking zone: 20 requests/second with a burst of 30. Prevents bot scalping while permitting concurrent user checkouts.
limit_req_zone $limit_ip zone=booking_rate_limit:10m rate=20r/s;

# 2. Auth zone: 20 requests/second with a burst of 30. Prevents brute-force credential stuffing.
limit_req_zone $limit_ip zone=auth_rate_limit:10m rate=20r/s;

# 3. General API zone: 40 requests/second with a burst of 50.
limit_req_zone $limit_ip zone=general_rate_limit:10m rate=40r/s;

server {
    listen 8080;
    server_name localhost;

    # Global CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Auth-Token,X-User-ID,X-Rate-Limit-Bypass' always;

    # HTTP status code for rate-limited requests
    limit_req_status 429;

    # Custom JSON response for rate limited requests (RFC 6585)
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Retry-After' '1' always;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please slow down to prevent bot scalping.","retryAfter":1}\n';
    }

    # Preflight OPTIONS handling
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Gateway self health check
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"ok"}';
    }

    # Route Auth Service (with brute-force protection rate limit)
    location /api/auth {
        limit_req zone=auth_rate_limit burst=15 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /auth {
        limit_req zone=auth_rate_limit burst=15 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Route Catalog Service Health
    location /api/catalog/health {
        proxy_pass http://catalog_service/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route Catalog Service Events
    location /api/events {
        limit_req zone=general_rate_limit burst=40 nodelay;
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /events {
        limit_req zone=general_rate_limit burst=40 nodelay;
        proxy_pass http://catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Route Inventory Service
    location /api/inventory {
        limit_req zone=general_rate_limit burst=40 nodelay;
        proxy_pass http://inventory_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /inventory {
        limit_req zone=general_rate_limit burst=40 nodelay;
        proxy_pass http://inventory_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Route Booking Service (with anti-scalping rate limit)
    location /api/bookings {
        limit_req zone=booking_rate_limit burst=30 nodelay;
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /bookings {
        limit_req zone=booking_rate_limit burst=30 nodelay;
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Route DLQ Management & Monitoring
    location /api/dlq {
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /dlq {
        proxy_pass http://booking_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}

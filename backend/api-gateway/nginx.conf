# Upstream microservice definitions
upstream catalog_service {
    server catalog-service:8081;
}

upstream inventory_service {
    server inventory-service:8082;
}

upstream booking_service {
    server booking-service:8083;
}

upstream auth_service {
    server auth-service:8084;
}

upstream notification_service {
    server notification-service:8085;
}

# Map for rate limit key: allows whitelisted internal tests/services to bypass,
# while enforcing strict per-IP rate limiting on all public client traffic.
map $http_x_rate_limit_bypass $limit_ip {
    "true" "";
    "1" "";
    default $binary_remote_addr;
}

# Map for correlation ID: use client-supplied X-Correlation-ID, fallback to X-Request-ID, fallback to $request_id
map $http_x_correlation_id $temp_correlation_id {
    default $http_x_correlation_id;
    ""      $http_x_request_id;
}

map $temp_correlation_id $correlation_id {
    default $temp_correlation_id;
    ""      $request_id;
}

# Structured JSON access logging format for centralized log collectors and tracing
log_format json_combined escape=json
  '{"timestamp":"$time_iso8601",'
  '"service":"api-gateway",'
  '"correlationId":"$correlation_id",'
  '"remoteAddr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bodyBytesSent":$body_bytes_sent,'
  '"requestTime":$request_time,'
  '"upstreamResponseTime":"$upstream_response_time",'
  '"upstreamAddr":"$upstream_addr",'
  '"userAgent":"$http_user_agent"}';

# Rate limit zones:
# 1. Booking zone: 20 requests/second with a burst of 30. Prevents bot scalping while permitting concurrent user checkouts.
limit_req_zone $limit_ip zone=booking_rate_limit:10m rate=20r/s;

# 2. Auth zone: 20 requests/second with a burst of 30. Prevents brute-force credential stuffing.
limit_req_zone $limit_ip zone=auth_rate_limit:10m rate=20r/s;

# 3. General API zone: 40 requests/second with a burst of 50.
limit_req_zone $limit_ip zone=general_rate_limit:10m rate=40r/s;

server {
    listen 8080;
    server_name localhost;

    # Structured JSON access log
    access_log /var/log/nginx/access.log json_combined;

    # Global CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Auth-Token,X-User-ID,X-Rate-Limit-Bypass,X-Correlation-ID,X-Request-ID' always;
    add_header 'Access-Control-Expose-Headers' 'X-Correlation-ID, X-Request-ID, Retry-After, Content-Length, Content-Range' always;

    # Distributed Tracing Response Headers
    add_header 'X-Correlation-ID' $correlation_id always;
    add_header 'X-Request-ID' $correlation_id always;

    # HTTP status code for rate-limited requests
    limit_req_status 429;

    # Custom JSON response for rate limited requests (RFC 6585)
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Retry-After' '1' always;
        add_header 'X-Correlation-ID' $correlation_id always;
        add_header 'X-Request-ID' $correlation_id always;
        add_header 'Access-Control-Expose-Headers' 'X-Correlation-ID, X-Request-ID, Retry-After' always;
        return 429 '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please slow down to prevent bot scalping.","retryAfter":1}\n';
    }

    # Preflight OPTIONS handling
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Gateway self health check
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"ok","service":"api-gateway"}';
    }

    # Gateway self metrics check (R23)
    location = /metrics {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"ok","service":"api-gateway"}';
    }

    # Swagger UI & OpenAPI Specification (Milestone 14 / R14.1)
    rewrite ^/docs$ /docs/ permanent;
    rewrite ^/api/docs$ /api/docs/ permanent;
    rewrite ^/api/docs/(.*)$ /docs/$1 last;

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        charset utf-8;
        charset_types text/yaml text/plain application/json;
        types {
            text/html                             html htm;
            text/css                              css;
            application/javascript                js;
            application/json                      json;
            text/yaml                             yaml yml;
            image/png                             png;
            image/svg+xml                         svg;
        }
    }

    # Route Auth Service (with brute-force protection rate limit)
    location /api/auth {
        limit_req zone=auth_rate_limit burst=15 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $correlation_id;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /auth {
        limit_req zone=auth_rate_limit burst=15 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

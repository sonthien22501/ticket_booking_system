  /api/inventory/cancel:
    post:
      description: Compensating transaction endpoint called during Saga rollback or customer booking cancellation.
      parameters:
        - in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      requestBody:
        required: true
        description: Cancellation payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSeatsRequest"
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: CANCELLED
                    type: string
                type: object
          description: Seats reverted to available
      summary: Cancel booked seats (Compensating transaction)
      tags:
        - Inventory
  /api/inventory/commit:
    post:
      description: Finalizes a temporary reservation into permanently BOOKED seats upon payment confirmation.
      parameters:
        - in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      requestBody:
        required: true
        description: Commit verification payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitSeatsRequest"
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: COMMITTED
                    type: string
                type: object
          description: Reservation committed
      summary: Commit reservation to booked status
      tags:
        - Inventory
  /api/inventory/janitor/sweep:
    post:
      description: Maintenance endpoint that audits expired HOLD seats and returns them to AVAILABLE.
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: COMPLETED
                    type: string
                  sweptReservations:
                    type: integer
                type: object
          description: Janitor sweep report
      summary: Trigger janitor sweep of expired holds
      tags:
        - Inventory
  /api/inventory/release:
    post:
      description: Manually or automatically releases held seats back to AVAILABLE status.
      parameters:
        - in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      requestBody:
        required: true
        description: Release payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseSeatsRequest"
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: RELEASED
                    type: string
                type: object
          description: Reservation released
      summary: Release held reservation
      tags:
        - Inventory
  /api/inventory/reservations/{id}:
    get:
      description: "Queries the status, remaining hold duration, and seat assignments for a reservation."
      parameters:
        - description: Reservation ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
          description: Active reservation status
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Reservation not found or expired
      summary: Inspect reservation hold status
      tags:
        - Inventory
  /api/inventory/reserve:
    post:
      description: Places a temporary hold (default 120s) on specified seats using distributed Redis locking.
      parameters:
        - description: Unique idempotency key to prevent duplicate reservation calls
          in: header
          name: "Idempotency-Key"
          required: false
          schema:
            type: string
        - description: Distributed trace correlation identifier
          in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveSeatsRequest"
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
          description: Seats held successfully
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Conflict - Seats are already held or booked"
      summary: Reserve seats with temporary hold
      tags:
        - Inventory
    patch:
      tags:
        - Inventory
      summary: Extend or update temporary seat reservation hold (PATCH)
      description: Updates lease hold expiration or requested seats under distributed lock.
      parameters:
        - name: "Idempotency-Key"
          in: header
          required: true
          description: Unique idempotency token
          schema:
            type: string
          example: "idem-key-1718000000"
        - name: "X-Correlation-ID"
          in: header
          required: false
          description: Distributed tracing correlation identifier
          schema:
            type: string
          example: "corr-uuid-101"
      requestBody:
        required: true
        description: Seat reservation parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveSeatsRequest"
      responses:
        200:
          description: Reservation hold updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        400:
          description: Invalid reservation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Seat conflict or capacity exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

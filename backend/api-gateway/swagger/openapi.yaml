components:
  schemas:
    AuthResponse:
      properties:
        token:
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          type: string
          description: Cryptographically signed JWT bearer token
        user:
          $ref: "#/components/schemas/User"
          description: Authenticated user identity profile
          example:
            id: "usr-101"
            email: "customer@example.com"
            name: John Doe
            role: customer
      required:
        - token
        - user
      type: object
    Booking:
      properties:
        bookingReference:
          example: "BKG-ABCD-1234"
          type: string
          description: "Human-readable booking reference code"
        createdAt:
          format: "date-time"
          type: string
          description: "ISO-8601 booking creation timestamp"
          example: "2026-10-18T10:00:00Z"
        customerEmail:
          example: "john@example.com"
          type: string
          description: Contact email address of purchaser
        customerName:
          example: John Doe
          type: string
          description: Name of the purchaser
        eventId:
          example: "evt-101"
          type: string
          description: Associated event identifier
        eventTitle:
          example: Coldplay World Tour
          type: string
          description: Title of the booked event
        id:
          example: "bkg-1718000000"
          type: string
          description: Unique booking order identifier
        idempotencyKey:
          example: "idem-key-1718000000"
          type: string
          description: Unique client idempotency token
        paymentStatus:
          example: COMPLETED
          type: string
          description: Payment processing state
        quantity:
          example: 2
          type: integer
          description: Number of tickets included in booking
        reservationId:
          example: "res-101"
          type: string
          description: Associated seat hold reservation identifier
        seatIds:
          example:
            - "seat-a1"
            - "seat-a2"
          items:
            type: string
          type: array
          description: Array of reserved seat identifiers
        status:
          enum:
            - CONFIRMED
            - PENDING
            - CANCELLED
          example: CONFIRMED
          type: string
          description: Current lifecycle status of booking
        tickets:
          items:
            $ref: "#/components/schemas/BookingTicket"
          type: array
          description: Collection of individual ticket barcodes
          example:
            - id: "tkt-1"
              seatLabel: "Row A, Seat 1"
        tierId:
          example: "tier-vip"
          type: string
          description: Purchased seating tier identifier
        totalAmount:
          example: 240
          format: double
          type: number
          description: Total price paid in EUR
        updatedAt:
          format: "date-time"
          type: string
          description: "ISO-8601 timestamp of last status update"
          example: "2026-10-18T10:01:00Z"
        userId:
          example: "usr-101"
          type: string
          description: Authenticated customer account ID
      required:
        - id
        - bookingReference
        - userId
        - eventId
        - quantity
        - totalAmount
        - status
      type: object
    BookingTicket:
      properties:
        bookingId:
          example: "bkg-101"
          type: string
          description: Parent booking order identifier
        createdAt:
          format: "date-time"
          type: string
          description: Ticket issuance timestamp
          example: "2026-10-18T10:01:00Z"
        id:
          example: "tkt-001"
          type: string
          description: Unique ticket identifier
        seatId:
          example: "seat-a1"
          type: string
          description: Allocated seat identifier
        seatLabel:
          example: "Row A, Seat 1"
          type: string
          description: Physical seating location label
        status:
          example: VALID
          type: string
          description: "Ticket admission status (ACTIVE, USED, TRANSFERRED, CANCELLED)"
        ticketCode:
          example: "CODE-COLDPLAY-VIP-001"
          type: string
          description: Verification barcode string
        ticketId:
          example: "tkt-001"
          type: string
          description: Alternative alias for ticket identifier
      type: object
    CancelBookingResponse:
      properties:
        bookingId:
          example: "bkg-101"
          type: string
          description: Identifier of cancelled booking order
        message:
          example: Booking cancelled successfully
          type: string
          description: Confirmation details of cancellation and refund
        status:
          example: CANCELLED
          type: string
          description: Final cancellation state
      type: object
    ClaimWaitlistResponse:
      properties:
        bookingReference:
          example: "BKG-WL-1234"
          type: string
          description: New booking reference code created from claimed seat
        id:
          example: "bkg-101"
          type: string
          description: Waitlist entry identifier
        status:
          example: CONFIRMED
          type: string
          description: Claim outcome status
      type: object
    CreateBookingRequest:
      properties:
        customerEmail:
          example: "john@example.com"
          format: email
          type: string
          description: Email address for confirmation receipt
        customerName:
          example: John Doe
          type: string
          description: Legal full name of purchaser
        eventId:
          example: "evt-101"
          type: string
          description: Target event identifier
        holdSeconds:
          default: 120
          type: integer
          description: Temporary hold lease duration in seconds
          example: 600
        idempotencyKey:
          example: "idem-xyz-987"
          type: string
          description: "Client-provided deduplication key"
        paymentInfo:
          properties:
            cardToken:
              example: tok_visa_4242
              type: string
            method:
              example: card
              type: string
          type: object
          description: Payment transaction details
          example:
            method: CREDIT_CARD
            token: tok_visa
        seats:
          example:
            - "A-1"
            - "A-2"
          items:
            type: string
          type: array
          description: Array of specific seats selected
        ticketCount:
          example: 2
          type: integer
          description: Number of tickets requested
        tierId:
          example: "tier-vip"
          type: string
          description: Target ticket tier identifier
        userId:
          example: "usr-101"
          type: string
          description: Authenticated customer user identifier
      required:
        - eventId
        - customerEmail
        - ticketCount
      type: object
    DLQMessage:
      properties:
        errorMessage:
          example: Connection reset during saga reservation
          type: string
          description: Stack trace or error explanation
        messageId:
          example: "msg-101"
          type: string
          description: Unique message identifier in broker
        payload:
          type: object
          description: Original message payload object
          example:
            bookingId: "bkg-101"
            eventId: "evt-101"
        queueName:
          example: saga.dlq
          type: string
          description: Source AMQP queue where failure occurred
        retryCount:
          example: 3
          type: integer
          description: Total number of consumer retries attempted
        routingKey:
          example: inventory.reserve
          type: string
          description: Message AMQP routing key
        timestamp:
          format: "date-time"
          type: string
          description: Timestamp when message was routed to DLQ
          example: "2026-10-18T10:05:00Z"
      type: object
    DLQRetryResponse:
      properties:
        reprocessed:
          example: 5
          type: integer
          description: Count of successfully reprocessed messages
        status:
          example: REPROCESSED
          type: string
          description: "Outcome status of dead-letter requeue operation"
      type: object
    DLQStatsResponse:
      properties:
        consumerCount:
          example: 1
          type: integer
          description: Number of active consumer worker processes listening
        messageCount:
          example: 0
          type: integer
          description: Number of dead messages currently waiting in queue
        queueName:
          example: saga.dlq
          type: string
          description: Name of Dead Letter Queue
      type: object
    ErrorResponse:
      properties:
        error:
          example: RATE_LIMIT_EXCEEDED
          type: string
          description: "Machine-readable error tag"
        message:
          example: Too many requests. Please slow down.
          type: string
          description: "Human-readable error explanation"
        retryAfter:
          example: 1
          type: integer
          description: Suggested wait time in seconds before retrying
      required:
        - error
      type: object
    Event:
      properties:
        category:
          example: Concert
          type: string
          description: Event genre classification
        createdAt:
          format: "date-time"
          type: string
          description: "ISO-8601 event publication timestamp"
          example: "2026-10-18T00:00:00Z"
        description:
          example: Live stadium concert experience
          type: string
          description: Event itinerary and details
        endTime:
          format: "date-time"
          type: string
          description: "ISO-8601 concert end time"
          example: "2026-08-15T22:30:00Z"
        id:
          example: "evt-101"
          type: string
          description: Unique event identifier
        imageUrl:
          example: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745"
          type: string
          description: Promotional poster artwork URL
        startTime:
          format: "date-time"
          type: string
          description: "ISO-8601 concert start time"
          example: "2026-08-15T19:00:00Z"
        status:
          example: ACTIVE
          type: string
          description: "Event lifecycle state (DRAFT, PUBLISHED, ARCHIVED, CANCELLED)"
        tiers:
          items:
            $ref: "#/components/schemas/EventTier"
          type: array
          description: List of associated seating and ticket tiers
          example:
            - tierId: "tier-vip"
              name: VIP
              price: 150.0
        title:
          example: "Coldplay - Music of the Spheres World Tour"
          type: string
          description: Public title of the event
        updatedAt:
          format: "date-time"
          type: string
          description: "ISO-8601 timestamp of last event update"
          example: "2026-10-18T01:00:00Z"
        venueLocation:
          example: "London, UK"
          type: string
          description: City and country location
        venueName:
          example: Wembley Stadium
          type: string
          description: Auditorium or stadium name
      required:
        - id
        - title
        - category
        - venueName
        - startTime
        - endTime
        - status
      type: object
    EventListResponse:
      items:
        $ref: "#/components/schemas/Event"
      type: array
    EventTier:
      properties:
        availableSeats:
          example: 85
          type: integer
          description: Remaining unbooked seats
        capacity:
          example: 100
          type: integer
          description: Total seat allocation in this tier
        eventId:
          example: "evt-101"
          type: string
          description: Parent event identifier
        name:
          example: VIP Seating
          type: string
          description: Tier display name
        price:
          example: 120
          format: double
          type: number
          description: Ticket unit price in EUR
        tierId:
          example: "tier-vip"
          type: string
          description: Unique tier identifier
      required:
        - tierId
        - name
        - price
        - capacity
      type: object
    HealthResponse:
      properties:
        components:
          additionalProperties:
            properties:
              details:
                type: object
              status:
                example: UP
                type: string
            type: object
          type: object
          description: "Subcomponent health diagnostics (PostgreSQL, Redis, RabbitMQ)"
          example:
            db:
              status: UP
        service:
          example: "catalog-service"
          type: string
          description: Name of the microservice reporting health
        status:
          example: UP
          type: string
          description: "Service health state (UP, DOWN, DEGRADED)"
        timestamp:
          example: "2026-10-18T00:00:00Z"
          type: string
          description: "ISO-8601 health check probe timestamp"
        uptime_seconds:
          example: 124.5
          type: number
          description: System uptime duration in seconds
        version:
          example: 1.0.0
          type: string
          description: Semantic application version
      type: object
    InventoryResponse:
      properties:
        availableSeats:
          example: 150
          type: integer
          description: Unreserved available seats
        bookedSeats:
          example: 30
          type: integer
          description: Permanently confirmed booked seats
        eventId:
          example: "evt-101"
          type: string
          description: Event identifier
        reservedSeats:
          example: 20
          type: integer
          description: Seats locked under active checkout hold lease
        tiers:
          items:
            properties:
              available_seats:
                type: integer
              tier_id:
                type: string
              tier_name:
                type: string
              total_seats:
                type: integer
            type: object
          type: array
          description: Breakdown of available seats by tier
          example:
            - tierId: "tier-vip"
              name: VIP
              price: 150.0
        totalSeats:
          example: 200
          type: integer
          description: Total venue seating capacity
      type: object
    JoinWaitlistRequest:
      properties:
        customerEmail:
          example: "jane@example.com"
          format: email
          type: string
          description: Attendee notification email
        customerName:
          example: Jane Doe
          type: string
          description: Attendee full name
        eventId:
          example: "evt-101"
          type: string
          description: Target event identifier
        quantity:
          default: 1
          example: 1
          type: integer
          description: Desired ticket quantity
        seatId:
          example: "seat-a1"
          type: string
          description: Specific seat identifier if waitlisting for single seat
        tierId:
          example: "tier-vip"
          type: string
          description: Target ticket tier identifier
        userId:
          example: "usr-101"
          type: string
          description: Authenticated customer account ID
      required:
        - eventId
        - customerEmail
      type: object
    LoginRequest:
      properties:
        email:
          example: "customer@tickets.com"
          format: email
          type: string
          description: Registered customer email address
        password:
          example: securepass123
          format: password
          type: string
          description: Customer authentication password
      required:
        - email
        - password
      type: object
    MetricsResponse:
      properties:
        connection_pool:
          properties:
            idle:
              example: 4
              type: integer
            in_use:
              example: 1
              type: integer
            max_open_connections:
              example: 25
              type: integer
            open_connections:
              example: 5
              type: integer
          type: object
          description: Database connection pool metrics
          example:
            active: 5
            idle: 15
            max: 20
        memory:
          properties:
            alloc_bytes:
              example: 4194304
              type: integer
            num_goroutines:
              example: 12
              type: integer
            sys_bytes:
              example: 16777216
              type: integer
          type: object
          description: Go runtime memory telemetry
          example:
            alloc_bytes: 1048576
            heap_sys_bytes: 4194304
        service:
          example: "catalog-service"
          type: string
          description: Service name
        timestamp:
          example: "2026-10-18T00:00:00Z"
          type: string
          description: Metrics collection timestamp
        uptime_seconds:
          example: 124.5
          type: number
          description: Service uptime in seconds
      type: object
    RegisterRequest:
      properties:
        email:
          example: "newuser@tickets.com"
          format: email
          type: string
          description: User registration email address
        name:
          example: Morgan Reed
          type: string
          description: Full legal user name
        password:
          example: securepass123
          format: password
          type: string
          description: User password (min 6 characters)
        role:
          default: customer
          enum:
            - customer
            - admin
          type: string
          description: "RBAC role assignment (customer, organizer, admin)"
          example: customer
      required:
        - email
        - password
        - name
      type: object
    ReservationResponse:
      properties:
        eventId:
          example: "evt-101"
          type: string
          description: Associated event identifier
        expiresAt:
          format: "date-time"
          type: string
          description: "ISO-8601 lease expiration timestamp"
          example: "2026-10-18T10:10:00Z"
        quantity:
          example: 2
          type: integer
          description: Count of held seats
        reservationId:
          example: "res-1718000000-xyz"
          type: string
          description: Unique seat hold lease identifier
        seats:
          example:
            - "A-1"
            - "A-2"
          items:
            type: string
          type: array
          description: Array of reserved seat identifiers
        status:
          example: HOLD
          type: string
          description: "Reservation hold status (HELD, COMMITTED, RELEASED, EXPIRED)"
      required:
        - reservationId
        - eventId
        - status
        - expiresAt
      type: object
    ReserveSeatsRequest:
      properties:
        eventId:
          example: "evt-101"
          type: string
          description: Event identifier
        holdSeconds:
          default: 120
          example: 120
          type: integer
          description: Lease hold duration in seconds
        seats:
          example:
            - "A-1"
            - "A-2"
          items:
            type: string
          type: array
          description: Specific seat codes requested
        ticketCount:
          example: 2
          type: integer
          description: Number of seats to reserve
        tierId:
          example: "tier-vip"
          type: string
          description: Ticket tier identifier
      required:
        - eventId
      type: object
    SeatItem:
      properties:
        eventId:
          example: "evt-101"
          type: string
          description: Event identifier
        holdExpiresAt:
          format: "date-time"
          nullable: true
          type: string
          description: Timestamp when active hold lease expires
          example: "2026-10-18T10:10:00Z"
        id:
          example: "seat-a1"
          type: string
          description: Unique seat identifier
        number:
          example: 1
          type: integer
          description: Seat position number within row
        reservationId:
          example: "res-abc12345"
          nullable: true
          type: string
          description: Active hold reservation lease ID
        row:
          example: A
          type: string
          description: Seating row label
        status:
          enum:
            - AVAILABLE
            - HOLD
            - BOOKED
            - BLOCKED
          example: AVAILABLE
          type: string
          description: "Occupancy state (AVAILABLE, HELD, BOOKED)"
        tierId:
          example: "tier-vip"
          type: string
          description: Tier identifier
      required:
        - id
        - eventId
        - tierId
        - row
        - number
        - status
      type: object
    User:
      properties:
        createdAt:
          format: "date-time"
          type: string
          description: Account registration timestamp
          example: "2026-10-18T00:00:00Z"
        email:
          example: "customer@tickets.com"
          format: email
          type: string
          description: User email address
        id:
          example: "usr-1718000000"
          type: string
          description: Unique user account identifier
        name:
          example: Alex Customer
          type: string
          description: User full legal name
        role:
          enum:
            - customer
            - admin
          example: customer
          type: string
          description: "RBAC role (customer, organizer, admin)"
      required:
        - id
        - email
        - name
        - role
      type: object
    UserClaims:
      properties:
        email:
          example: "customer@tickets.com"
          type: string
          description: User email address claim
        name:
          example: Alex Customer
          type: string
          description: User full name claim
        role:
          example: customer
          type: string
          description: Security role claim
        userId:
          example: "usr-1718000000"
          type: string
          description: Subject user account identifier
      type: object
    WaitlistEntry:
      properties:
        createdAt:
          format: "date-time"
          type: string
          description: Queue enrollment timestamp
          example: "2026-10-18T08:00:00Z"
        customerEmail:
          example: "jane@example.com"
          format: email
          type: string
          description: Notification email address
        customerName:
          example: Jane Doe
          type: string
          description: Attendee name
        eventId:
          example: "evt-101"
          type: string
          description: Target event identifier
        expiresAt:
          format: "date-time"
          nullable: true
          type: string
          description: Expiration timestamp for claiming promoted ticket
          example: "2026-10-18T10:30:00Z"
        id:
          example: "wt-1718000000"
          type: string
          description: Unique waitlist queue identifier
        position:
          example: 1
          type: integer
          description: Current FIFO queue rank position
        promotedAt:
          format: "date-time"
          nullable: true
          type: string
          description: Timestamp when entry was promoted to claim offer
          example: "2026-10-18T10:15:00Z"
        quantity:
          example: 1
          type: integer
          description: Number of tickets desired
        reservationId:
          example: "res-promoted-123"
          type: string
          description: Associated hold reservation if promoted
        seatId:
          example: "seat-a1"
          type: string
          description: Specific seat requested if applicable
        status:
          enum:
            - PENDING
            - PROMOTED
            - CLAIMED
            - EXPIRED
            - CANCELLED
          example: PENDING
          type: string
          description: "Waitlist state (WAITING, PROMOTED, CLAIMED, CANCELLED)"
        tierId:
          example: "tier-vip"
          type: string
          description: Target ticket tier identifier
        updatedAt:
          format: "date-time"
          type: string
          description: Last update timestamp
          example: "2026-10-18T10:15:00Z"
        userId:
          example: "usr-101"
          type: string
          description: Attendee user identifier
      required:
        - id
        - eventId
        - userId
        - customerName
        - customerEmail
        - quantity
        - status
      type: object
    WaitlistStatusResponse:
      properties:
        count:
          example: 1
          type: integer
          description: Total number of active waitlist entries in queue
        entries:
          items:
            $ref: "#/components/schemas/WaitlistEntry"
          type: array
          description: Collection of active waitlist queue entries
          example:
            - id: "wait-101"
              position: 1
      type: object
    EventStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: "Target event lifecycle status (DRAFT, PUBLISHED, ARCHIVED, CANCELLED)"
          example: PUBLISHED
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
            - CANCELLED
    DLQSimulateRequest:
      type: object
      required:
        - type
        - errorMessage
      properties:
        type:
          type: string
          description: Failure scenario type
          example: poison
          enum:
            - poison
            - retry_fail
            - direct_dlq
        errorMessage:
          type: string
          description: Simulated error diagnostic message
          example: Simulated consumer processing failure
        routingKey:
          type: string
          description: AMQP routing key target
          example: booking.confirmed
        payload:
          type: object
          description: Synthetic message payload object
          example:
            bookingId: "bkg-101"
    CancelSeatsRequest:
      type: object
      properties:
        bookingId:
          type: string
          description: Booking order identifier
          example: "bkg-101"
        eventId:
          type: string
          description: Event identifier
          example: "evt-101"
        reservationId:
          type: string
          description: Reservation hold identifier
          example: "res-101"
        tierId:
          type: string
          description: Ticket tier identifier
          example: "tier-vip"
        quantity:
          type: integer
          description: Seat count to release
          example: 2
        seatIds:
          type: array
          description: Array of seat identifiers
          items:
            type: string
          example:
            - "seat-a1"
            - "seat-a2"
        reason:
          type: string
          description: Cancellation justification note
          example: Customer requested full refund.
    CommitSeatsRequest:
      type: object
      required:
        - reservationId
        - bookingId
      properties:
        reservationId:
          type: string
          description: Reservation hold lease identifier
          example: "res-101"
        bookingId:
          type: string
          description: Associated confirmed booking identifier
          example: "bkg-101"
    ReleaseSeatsRequest:
      type: object
      required:
        - reservationId
      properties:
        reservationId:
          type: string
          description: Reservation hold lease identifier
          example: "res-101"
        reason:
          type: string
          description: Release reason description
          example: Checkout session timed out
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: Standard Bearer JWT token obtained from `/api/auth/login` or `/api/auth/register`.
      scheme: bearer
      type: http
info:
  contact:
    email: "engineering@tickets.com"
    name: System Engineering Team
  description: |
    Production-grade OpenAPI 3.0 specification for the Distributed Ticket Booking System.
    Covers Authentication, Event Catalog, Seat Inventory, Booking & Saga Orchestration,
    Waitlist Management, and RabbitMQ Dead Letter Queue (DLQ) operations.
  title: Distributed Ticket Booking System API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/auth/login:
    post:
      description: Verifies user credentials and generates a signed JWT token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Authentication successful
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

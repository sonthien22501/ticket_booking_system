      tags:
        - Webhooks
      summary: Get webhook subscription details
      responses:
        200:
          description: Subscription details
    delete:
      tags:
        - Webhooks
      summary: Delete webhook subscription
      responses:
        200:
          description: Subscription removed
  /api/webhooks/deliveries:
    get:
      tags:
        - Webhooks
      summary: Query webhook delivery audit logs
      responses:
        200:
          description: List of delivery audit entries
  /api/webhooks/dispatch:
    post:
      tags:
        - Webhooks
      summary: Test dispatch a webhook event
      responses:
        200:
          description: Event dispatched
  /api/events/{id}/pricing:
    get:
      tags:
        - Catalog
      summary: "Get dynamic surge pricing for event (R27, R33)"
      description: "Returns real-time dynamic ticket pricing calculated from seat inventory scarcity and booking velocity, with service isolation fallback."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Dynamic surge pricing analysis
        404:
          description: Event not found
  /api/events/{id}/status:
    put:
      tags:
        - Catalog
      summary: Update event lifecycle status (PUT)
      description: "Transitions event state between DRAFT, PUBLISHED, ARCHIVED, or CANCELLED."
      parameters:
        - name: id
          in: path
          required: true
          description: Unique event identifier
          schema:
            type: string
          example: "evt-101"
      requestBody:
        required: true
        description: Event status update payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStatusUpdateRequest"
      responses:
        200:
          description: Event status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        400:
          description: Invalid status transition payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized administrator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Catalog
      summary: Partially update event lifecycle status (PATCH)
      description: "Transitions event state between DRAFT, PUBLISHED, ARCHIVED, or CANCELLED."
      parameters:
        - name: id
          in: path
          required: true
          description: Unique event identifier
          schema:
            type: string
          example: "evt-101"
      requestBody:
        required: true
        description: Event status update payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStatusUpdateRequest"
      responses:
        200:
          description: Event status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        400:
          description: Invalid status transition payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized administrator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
servers:
  - description: API Gateway (Unified Entrypoint)

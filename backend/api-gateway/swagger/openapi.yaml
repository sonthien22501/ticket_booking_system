  - description: "High-throughput event discovery and ticket tier details with Redis caching"
    name: Catalog
  - description: "Real-time seat inventory, distributed Redis locks, and hold reservation lifecycles"
    name: Inventory
  - description: "Distributed booking lifecycle, idempotency key deduplication, and Saga orchestration"
    name: Bookings
  - description: "FIFO waitlist queueing, cancellation, and automatic promotion claiming"
    name: Waitlist
  - description: "Dead Letter Queue introspection, reprocessing, purging, and failure simulation"
    name: DLQ
  - description: Infrastructure health checks and diagnostic telemetry
    name: System

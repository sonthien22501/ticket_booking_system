  /api/bookings:
    get:
      description: "Retrieves booking records with optional filters for user, event, or status."
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
        - in: query
          name: eventId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Booking"
                type: array
          description: List of bookings
      security:
        - BearerAuth: []
      summary: List bookings
      tags:
        - Bookings
    post:
      description: |
    Initiates a multi-step Saga distributed transaction: reserves inventory, captures payment,
    and generates confirmed tickets. Supports replay-safe idempotency.
      parameters:
        - description: Unique client key for preventing double charging and duplicate reservations
          in: header
          name: "Idempotency-Key"
          required: false
          schema:
            type: string
        - description: Distributed trace correlation identifier
          in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
          description: Idempotent replay of previously confirmed booking
          headers:
            X-Idempotent-Replay:
              description: Indicates request was served from cached idempotency record
              schema:
                type: string
        201:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
          description: Booking confirmed and tickets issued
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Concurrency conflict or sold out
      security:
        - BearerAuth: []
      summary: Create booking (Saga Orchestration)
      tags:
        - Bookings
  /api/bookings/{id}:
    delete:
      description: Cancels confirmed booking and triggers compensating inventory release.
      parameters:
        - description: Booking ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        204:
          description: Booking cancelled and deleted / No Content
        200:
          description: Booking cancellation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
        400:
          description: Invalid cancellation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
      summary: Cancel booking
      tags:
        - Bookings
    get:
      description: Retrieves single booking record with individual ticket barcode tokens.
      parameters:
        - description: Booking ID or booking reference code
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
          description: Booking retrieved
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Booking not found
      security:
        - BearerAuth: []
      summary: Get booking details
      tags:
        - Bookings
  /api/bookings/{id}/cancel:
    post:
      description: Alternative POST endpoint to cancel a booking and execute compensating releases.
      parameters:
        - description: Booking ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: "X-Correlation-ID"
          required: false
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelBookingResponse"
          description: Booking cancelled
      security:
        - BearerAuth: []
      summary: Cancel booking via POST
      tags:
        - Bookings
  /api/dlq/messages:
    delete:
      description: Administrative purge of all unprocessable poison messages.
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  purged:
                    type: integer
                  status:
                    example: PURGED
                    type: string
                type: object
          description: Purge count
      summary: Purge all DLQ messages
      tags:
        - DLQ
    get:
      description: Inspects failed messages currently dwelling in the dead letter exchange.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            default: 100
            type: integer
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  count:
                    type: integer
                  messages:
                    items:
                      $ref: "#/components/schemas/DLQMessage"
                    type: array
                  queueName:
                    type: string
                type: object
          description: Messages array
      summary: Peek DLQ poison messages
      tags:
        - DLQ
  /api/dlq/retry:
    post:
      description: "Re-queues dead-lettered messages back into primary processing queues for reprocessing."
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQRetryResponse"
          description: Reprocess summary
      summary: Reprocess DLQ messages
      tags:
        - DLQ
  /api/dlq/simulate:
    post:
      description: "Diagnostics endpoint to trigger controlled failures and test dead-letter routing."
      requestBody:
        required: true
        description: Simulation payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQSimulateRequest"
      responses:
        200:
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: SIMULATED
                    type: string
                type: object
          description: Poison pill routed to DLQ
      summary: Simulate DLQ poison pill ingestion
      tags:
        - DLQ
  /api/dlq/stats:
    get:
      description: "Inspects active message count, consumer readiness, and unroutable dead-letter depth."
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQStatsResponse"
          description: DLQ metrics
      summary: Get RabbitMQ Dead Letter Queue telemetry
      tags:
        - DLQ
  /api/events:
    get:
      description: Retrieves upcoming events with active ticket tiers. Results are cached in Redis with a 30s TTL.
      parameters:
        - description: "Optional filter by event category (e.g., Music, Sports, Theatre)"
